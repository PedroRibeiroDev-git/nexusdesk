services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusdesk}
      POSTGRES_USER: ${POSTGRES_USER:-nexusdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusdesk}
    volumes:
      - nexusdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusdesk} -d ${POSTGRES_DB:-nexusdesk}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nexusdesk}
      DB_USER: ${POSTGRES_USER:-nexusdesk}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexusdesk}
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-to-at-least-32-characters}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexusdesk_pgdata:
